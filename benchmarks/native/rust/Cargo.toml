[package]
name = "wasmfga-native-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
wasmfga-engine = { path = "../../../engine-rust", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
