[package]
name = "wasmfga"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "38.0", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "38.0", default-features = false, features = ["p1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
